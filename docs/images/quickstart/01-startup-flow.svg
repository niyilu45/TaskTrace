<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">启动与退出流程（示意）</title>
  <desc id="desc">完整解压ZIP后双击TaskTrace.exe，默认显示置顶悬浮窗；通过完整界面入口打开网页。关闭或最小化悬浮窗只会隐藏到系统托盘，双击托盘图标恢复，右击托盘选择退出TaskTrace才真正退出。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#526782" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}
      .title{font-size:26px;font-weight:700;fill:#172b46}
      .subtitle{font-size:15px;fill:#64748b}
      .label{font-size:19px;font-weight:700;fill:#183653}
      .body{font-size:15px;fill:#526782}
      .step{font-size:14px;font-weight:700;fill:#2563eb}
      .action{font-size:15px;fill:#334b68}
      .route{fill:none;stroke:#526782;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="430" rx="18" fill="#f6f9fd"/>
  <text id="visualTitle" x="30" y="45" class="title">启动与退出流程（示意）</text>
  <text x="30" y="73" class="subtitle">两个界面共用同一份本机数据；隐藏窗口后，程序仍在运行。</text>

  <rect x="28" y="105" width="198" height="116" rx="13" fill="#fff" stroke="#d6e0eb"/>
  <text x="46" y="133" class="step">01 · 准备</text>
  <text x="46" y="165" class="label">解压 ZIP</text>
  <text x="46" y="193" class="body">完整解压到可写目录</text>

  <path d="M227 163H254" class="route"/>
  <rect x="260" y="105" width="198" height="116" rx="13" fill="#fff" stroke="#d6e0eb"/>
  <text x="278" y="133" class="step">02 · 启动</text>
  <text x="278" y="165" class="label">TaskTrace.exe</text>
  <text x="278" y="193" class="body">双击启动，无需注册</text>

  <path d="M459 163H486" class="route"/>
  <rect x="492" y="105" width="198" height="116" rx="13" fill="#eff6ff" stroke="#93b9f9"/>
  <text x="510" y="133" class="step">03 · 默认界面</text>
  <text x="510" y="165" class="label">置顶悬浮窗</text>
  <text x="510" y="193" class="body">查看事项、随手记录</text>

  <path d="M691 163H718" class="route"/>
  <rect x="724" y="105" width="208" height="116" rx="13" fill="#fff" stroke="#d6e0eb"/>
  <text x="742" y="133" class="step">04 · 点击“完整界面”</text>
  <text x="742" y="165" class="label">完整网页界面</text>
  <text x="742" y="193" class="body">浏览器中查看与编辑</text>

  <path d="M591 222V304" class="route"/>
  <rect x="524" y="250" width="134" height="25" rx="8" fill="#f6f9fd"/>
  <text x="591" y="268" text-anchor="middle" class="action">关闭 / 最小化</text>
  <rect x="464" y="310" width="226" height="82" rx="13" fill="#fff" stroke="#93b9f9"/>
  <text x="482" y="343" class="label">系统托盘</text>
  <text x="482" y="370" class="body">仅隐藏，程序继续运行</text>

  <path d="M464 351H423Q403 351 403 331V254Q403 240 420 240H508V223" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blueArrow)"/>
  <text x="116" y="310" class="action" fill="#2563eb">双击托盘图标 → 恢复悬浮窗</text>

  <path d="M691 351H718" class="route"/>
  <rect x="724" y="310" width="208" height="82" rx="13" fill="#fff7ed" stroke="#f3c392"/>
  <text x="742" y="343" class="label">真正退出程序</text>
  <text x="742" y="370" class="body">停止本机服务</text>
  <text x="932" y="285" text-anchor="end" class="action">右击托盘 → 退出 TaskTrace</text>
</svg>